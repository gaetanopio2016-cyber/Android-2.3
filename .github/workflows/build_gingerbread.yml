name: Compile Android 2.3 Gingerbread (janice)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ubuntu:20.04
      options: --user root

    steps:
      - name: Installa dipendenze base e scarica Java 6 direttamente
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y sudo curl wget git-core gnupg flex bison gperf build-essential \
            zip zlib1g-dev libc6-dev lib32ncurses5-dev x11proto-core-dev \
            libx11-dev libreadline-dev libgl1-mesa-dev tofrodos python-markdown \
            libxml2-utils xsltproc g++-multilib gcc-multilib python ca-certificates

          # Scarichiamo direttamente il pacchetto .deb stabile di OpenJDK 6 da Debian/Ubuntu archive
          mkdir -p /tmp/java6 && cd /tmp/java6
          wget -q https://launchpad.net/~openjdk-r/+archive/ubuntu/ppa/+build/13444062/+files/openjdk-6-jdk_6b41-1.13.13-1ubuntu1~16.04_amd64.deb
          wget -q https://launchpad.net/~openjdk-r/+archive/ubuntu/ppa/+build/13444062/+files/openjdk-6-jre_6b41-1.13.13-1ubuntu1~16.04_amd64.deb
          wget -q https://launchpad.net/~openjdk-r/+archive/ubuntu/ppa/+build/13444062/+files/openjdk-6-jre-lib_6b41-1.13.13-1ubuntu1~16.04_all.deb
          
          # Installiamo forzando i pacchetti scaricati localmente senza rogne di repo online
          dpkg -i *.deb || apt-get install -f -y
          rm -rf /tmp/java6

          echo "JAVA_HOME=/usr/lib/jvm/java-1.6.0-openjdk-amd64" >> $GITHUB_ENV
          echo "/usr/lib/jvm/java-1.6.0-openjdk-amd64/bin" >> $GITHUB_PATH

      - name: Configura Git
        run: |
          git config --global user.email "builder@github.action"
          git config --global user.name "Android Builder"

      - name: Installa Google Repo
        run: |
          mkdir -p ~/bin
          curl -s https://storage.googleapis.com/git-repo-downloads/repo-1 > ~/bin/repo
          chmod a+x ~/bin/repo
          echo "$HOME/bin" >> $GITHUB_PATH

      - name: Inizializza e scarica i sorgenti
        run: |
          mkdir -p ~/android/gingerbread
          cd ~/android/gingerbread
          repo init -u https://github.com/CyanogenMod/android.git -b gingerbread --depth=1
          sed -i '/android_hardware_ti_wpan/d' .repo/manifest.xml
          sed -i 's|https://android.googlesource.com/platform/prebuilt|https://github.com/CyanogenMod/android_prebuilt|g' .repo/manifest.xml
          repo sync -j8 --force-sync -c --no-tags || true

      - name: Avvia la compilazione
        shell: bash
        run: |
          cd ~/android/gingerbread
          echo "" > vendor/cyanogen/products/AndroidProducts.mk
          rm -f vendor/cyanogen/vendorsetup.sh
          . build/envsetup.sh
          lunch generic-eng
          make -j$(nproc)

      - name: Salva la ROM compilata come Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Android-2.3-Gingerbread
          path: ~/android/gingerbread/out/target/product/generic/*.img
