name: Compile Android 2.3 Gingerbread (janice)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ubuntu:18.04
      options: --user root

    steps:
      - name: Aggiorna e installa dipendenze base e legacy
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y sudo curl wget git-core gnupg flex bison gperf build-essential \
            zip zlib1g-dev libc6-dev lib32ncurses5-dev x11proto-core-dev \
            libx11-dev libreadline-dev libgl1-mesa-dev tofrodos python-markdown \
            libxml2-utils xsltproc g++-multilib gcc-multilib python ca-certificates

      - name: Installa Java 6 e compilatore GCC 4.8 legacy
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          echo "deb http://archive.ubuntu.com/ubuntu trusty main universe" >> /etc/apt/sources.list
          echo "deb http://security.ubuntu.com/ubuntu trusty-security main universe" >> /etc/apt/sources.list
          apt-get update
          apt-get install -y --allow-downgrades \
            openjdk-6-jdk \
            openjdk-6-jre \
            openjdk-6-jre-headless \
            openjdk-6-jre-lib \
            tzdata-java \
            gcc-4.8 g++-4.8 gcc-4.8-multilib g++-4.8-multilib
          update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-4.8 100
          update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-4.8 100
          echo "JAVA_HOME=/usr/lib/jvm/java-6-openjdk-amd64" >> $GITHUB_ENV
          echo "/usr/lib/jvm/java-6-openjdk-amd64/bin" >> $GITHUB_PATH

      - name: Configura Git
        run: |
          git config --global user.email "builder@github.action"
          git config --global user.name "Android Builder"

      - name: Installa Google Repo (versione compatibile Python 2/3)
        run: |
          mkdir -p ~/bin
          curl -s https://storage.googleapis.com/git-repo-downloads/repo-1 > ~/bin/repo
          chmod a+x ~/bin/repo
          echo "$HOME/bin" >> $GITHUB_PATH

      - name: Inizializza e scarica i sorgenti
        run: |
          mkdir -p ~/android/gingerbread
          cd ~/android/gingerbread
          repo init -u https://github.com/CyanogenMod/android.git -b gingerbread --depth=1
          sed -i '/android_hardware_ti_wpan/d' .repo/manifest.xml
          sed -i 's|https://android.googlesource.com/platform/prebuilt|https://github.com/CyanogenMod/android_prebuilt|g' .repo/manifest.xml
          repo sync -j8 --force-sync -c --no-tags || true

      - name: Avvia la compilazione
        shell: bash
        run: |
          cd ~/android/gingerbread
          echo "" > vendor/cyanogen/products/AndroidProducts.mk
          rm -f vendor/cyanogen/vendorsetup.sh
          . build/envsetup.sh
          lunch generic-eng
          make -j$(nproc)

      - name: Salva la ROM compilata come Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Android-2.3-Gingerbread
          path: ~/android/gingerbread/out/target/product/generic/*.img
